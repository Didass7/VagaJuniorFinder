name: Daily AI & Data Science Job Search

on:
  schedule:
    # Runs at 08:00 AM UTC every day
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Ensure only one scan runs at a time (prevent overlapping writes to data branch)
concurrency:
  group: job-search-pipeline
  cancel-in-progress: false

jobs:
  job-search-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4.2.2

      - name: 📦 Restore seen_jobs.json from data branch
        run: |
          # Fetch the data branch if it exists; restore seen_jobs.json from it
          git fetch origin data --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout origin/data -- seen_jobs.json 2>/dev/null || echo "No seen_jobs.json on data branch yet."
          else
            echo "Data branch does not exist yet — first run."
          fi
          # Show current state
          if [ -f seen_jobs.json ]; then
            echo "✅ Restored seen_jobs.json ($(wc -c < seen_jobs.json) bytes)"
          else
            echo "ℹ️ No previous seen_jobs.json — starting fresh."
          fi

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Execute Daily Job Finder Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL || 'diogon.oliveira1@gmail.com' }}
          ITJOBS_API_KEY: ${{ secrets.ITJOBS_API_KEY }}
          CACHE_FILE: seen_jobs.json
        run: |
          python main.py

      - name: 💾 Persist seen_jobs.json to data branch
        if: always()
        run: |
          if [ ! -f seen_jobs.json ]; then
            echo "No seen_jobs.json to persist."
            exit 0
          fi

          # Configure git identity for the commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or switch to the data branch
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout data
          else
            # Create an orphan branch (no code history, just data)
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
          fi

          # Stage and commit seen_jobs.json
          cp $GITHUB_WORKSPACE/seen_jobs.json seen_jobs.json 2>/dev/null || true
          git add seen_jobs.json
          if git diff --cached --quiet; then
            echo "No changes to seen_jobs.json — skipping commit."
          else
            SEEN_COUNT=$(python3 -c "import json; print(len(json.load(open('seen_jobs.json'))))" 2>/dev/null || echo "?")
            git commit -m "Update seen_jobs.json (${SEEN_COUNT} tracked jobs) [skip ci]"
            git push origin data
            echo "✅ Persisted seen_jobs.json with ${SEEN_COUNT} tracked jobs."
          fi

      - name: 📄 Upload Daily Markdown Report Artifact
        uses: actions/upload-artifact@v4.3.6
        with:
          name: daily-job-reports
          path: reports/*.md
          retention-days: 30
