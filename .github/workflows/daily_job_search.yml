name: Daily AI & Data Science Job Search

on:
  schedule:
    # Runs at 09:00 and 21:00 (Portugal time) / 08:00 and 20:00 (UTC) every day
    - cron: '0 8,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Ensure only one scan runs at a time (prevent overlapping writes to data branch)
concurrency:
  group: job-search-pipeline
  cancel-in-progress: false

jobs:
  job-search-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4.2.2

      - name: 📦 Restore data directory from data branch
        run: |
          # Fetch the data branch if it exists; restore data directory from it
          git fetch origin data --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout origin/data -- data 2>/dev/null || echo "No data directory on data branch yet."
          else
            echo "Data branch does not exist yet — first run."
          fi

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Automated Test Suite
        run: |
          python -m unittest discover tests

      - name: 🔍 Execute Daily Job Finder Pipeline
        env:
          ITJOBS_API_KEY: ${{ secrets.ITJOBS_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ENABLE_NOTION_SYNC: "true"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_all.py

      - name: 💾 Persist data directory to data branch
        if: always()
        run: |
          if [ ! -d data ]; then
            echo "No data directory to persist."
            exit 0
          fi

          # Save data directory to temp BEFORE resetting working tree
          cp -r data /tmp/data

          # Configure git identity for the commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clean working tree so branch checkout never conflicts with generated files
          git reset --hard
          git clean -fd

          # Create or switch to the data branch
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout -B data origin/data
          else
            # Create an orphan branch (no code history, just data)
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
          fi

          # Restore data directory from temp and commit
          cp -r /tmp/data data
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to data directory — skipping commit."
          else
            git commit -m "Update job cache files [skip ci]"
            git push --force origin data
            echo "✅ Persisted data directory."
          fi


